
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      <!-- Primary SEO -->
      <title>Wetigo — Where to go? Find &amp; review the best places near you</title>
      <meta name="description" content="Wetigo helps you find where to go: discover, review and rate the best local places — restaurants, venues, gyms, cafes, shops. Read reviews, explore areas on the map, and find where to buy. Hara gedək? Bu paltarı haradan tapmaq olar? — Wetigo." />
      <meta name="keywords" content="where to go, places to go near me, review places, explore areas, find places, best restaurants near me, where to buy clothes, hara gedek, hara gedək, yer tövsiyəsi, məkan rəyləri, bu paltarı haradan tapmaq olar, donde ir, lugares cerca de mi, où aller, orte in der nähe, local business reviews, discover places" />
      <meta name="robots" content="index, follow, max-image-preview:large" />
      <link rel="canonical" href="https://wetigo.com/" />

      <!-- Icons -->
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <link rel="icon" type="image/png" href="/favicon.png" />
      <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
      <meta name="theme-color" content="#6200FF" />

      <!-- PWA (installable on Android & iOS) -->
      <link rel="manifest" href="/manifest.webmanifest" />
      <meta name="mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="default" />

      <!-- Open Graph -->
      <meta property="og:type" content="website" />

      <meta property="og:image" content="/og-image.png" />

      <!-- Twitter -->
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:title" content="Wetigo — Where to go?" />
      <meta name="twitter:description" content="Discover, review and rate the best local places near you." />
      <meta name="twitter:image" content="/og-image.png" />

      <!-- hreflang (multi-language) -->
      <link rel="alternate" hreflang="en" href="https://wetigo.com/en" />

      <link rel="alternate" hreflang="es" href="https://wetigo.com/es" />
      <link rel="alternate" hreflang="fr" href="https://wetigo.com/fr" />
      <link rel="alternate" hreflang="de" href="https://wetigo.com/de" />
      <link rel="alternate" hreflang="tr" href="https://wetigo.com/tr" />
      <link rel="alternate" hreflang="x-default" href="https://wetigo.com/" />

      <!-- Structured data -->
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Wetigo",
        "url": "https://wetigo.com/",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Web",
        "description": "Discover, review and rate the best local places. Where to go?",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "aggregateRating": { "@type": "AggregateRating", "ratingValue": "4.8", "reviewCount": "50000" }
      }
      </script>
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Wetigo",
        "url": "https://wetigo.com/",
        "inLanguage": ["en","az","tr","ru","es","fr","de"],
        "potentialAction": {
          "@type": "SearchAction",
          "target": { "@type": "EntryPoint", "urlTemplate": "https://wetigo.com/explore?q={search_term_string}" },
          "query-input": "required name=search_term_string"
        }
      }
      </script>
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Wetigo",
        "url": "https://wetigo.com/",
        "logo": "https://wetigo.com/favicon.png",
        "slogan": "Where to go?",
        "sameAs": [
          "https://instagram.com/wetigo",
          "https://twitter.com/wetigo",
          "https://facebook.com/wetigo"
        ]
      }

      <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
      <style>
        html, body { height: 100%; margin: 0; } #root { height: 100%; }
        .leaflet-container { font-family: inherit; }
        .wetigo-pin { background: none; border: none; }
        /* clean popup */
        .wetigo-popup .leaflet-popup-content-wrapper { padding: 0; border-radius: 16px; overflow: hidden; box-shadow: 0 18px 40px -12px rgba(0,0,0,.3); border: 1px solid #eee; }
        .wetigo-popup .leaflet-popup-content { margin: 0; width: 232px !important; }
        .wetigo-popup .leaflet-popup-tip { box-shadow: 0 18px 40px -12px rgba(0,0,0,.3); }
        .wetigo-popup a.leaflet-popup-close-button { display: none; }
      </style>
    </head>

    <body>
      <!-- Branded splash (shown instantly, fades out when the app is ready) -->
      <div id="wetigo-splash">
        <div class="ws-card"><img src="/icons/icon-192.png" alt="Wetigo" /></div>
        <div class="ws-word">Wetigo</div>
        <div class="ws-tag">Where to go?</div>
        <div class="ws-bar"><span></span></div>
      </div>
      <style>
        #wetigo-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;
          background:linear-gradient(150deg,#4a00cc 0%,#6200FF 55%,#7c10ff 100%);transition:opacity .45s ease,visibility .45s;}
        #wetigo-splash.ws-hide{opacity:0;visibility:hidden;}
        #wetigo-splash .ws-card{width:96px;height:96px;border-radius:24px;background:#fff;display:flex;align-items:center;justify-content:center;
          box-shadow:0 20px 50px rgba(0,0,0,.25);animation:wsPop .6s cubic-bezier(.2,.8,.2,1) both;}
        #wetigo-splash .ws-card img{width:78px;height:78px;object-fit:contain;}
        #wetigo-splash .ws-word{margin-top:18px;color:#fff;font-size:26px;font-weight:800;letter-spacing:.5px;opacity:0;animation:wsUp .5s .15s ease forwards;font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
        #wetigo-splash .ws-tag{color:rgba(255,255,255,.8);font-size:13px;margin-top:4px;opacity:0;animation:wsUp .5s .28s ease forwards;font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
        #wetigo-splash .ws-bar{margin-top:26px;width:140px;height:4px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden;}
        #wetigo-splash .ws-bar span{display:block;height:100%;width:40%;border-radius:999px;background:#fff;animation:wsBar 1.1s ease-in-out infinite;}
        @keyframes wsPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
        @keyframes wsUp{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
        @keyframes wsBar{0%{transform:translateX(-120%)}100%{transform:translateX(360%)}}
      </style>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      <script>
        // Register the PWA service worker (enables install on Android & iOS)
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
          });
        }
      </script>
    </body>
  </html>
